name: Solar System Workflow

on:
    workflow_dispatch:    #to run manually from the Actions tab
    push:
        branches:
            - main
            - 'feature/*'    #to run on push to any feature branch

env:
    MONGO_URI: mongodb+srv://supercluster.d83jj.mongodb.net/superData   #to provide mongodb URI
    MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}    #to store MongoDB username in repo variables
    MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}    #to securely store MongoDB password

jobs:
    unit-testing:
        name: Unit Testing
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            - name: Setup NodeJS Version
              uses: actions/setup-node@v4
              with:
                  node-version: 20   #specify the version of Node.js to use

            - name: Cache dependencies
              uses: actions/cache@v3    #to cache the node_modules directory for faster builds
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

            - name: Install dependencies
              run: npm install    #to install the project dependencies

            - name: Run unit tests
              run: npm test    #to run the unit tests defined in the project

            - name: Archive test results
              uses: actions/upload-artifact@v7    #to upload test results as an artifact
              if: always()    #to ensure that the artifact is uploaded even if the tests fail
              with:
                name: Mocha-Test-Result
                path: test-results.xml

    code-coverage:
        runs-on: ubuntu-latest    #to run the job on the latest version of Ubuntu
        name: Code Coverage
        steps:
            - name: Checkout code
              uses: actions/checkout@v4    #to check out the code from the repository

            - name: Set up Node.js
              uses: actions/setup-node@v4    #to set up Node.js environment
              with:
                  node-version: 20   #specify the version of Node.js to use

            - name: Cache dependencies
              uses: actions/cache@v3    #to cache the node_modules directory for faster builds
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

            - name: Install NodeJS dependencies
              run: npm install    #to install the project dependencies

            - name: Run Code-coverage command
              continue-on-error: true    #to allow the workflow to continue even if the code coverage command fails
              run: npm run coverage    #to run the code coverage command defined in the project

            - name: Upload code coverage result
              uses: actions/upload-artifact@v7    #to upload code coverage report as an artifact
              with:
                  name: code-coverage-result
                  path: coverage       #specify the path to the code coverage report directory
                  retention-days: 5    #specify the number of days to retain the artifact

    docker:
        name: Docker Build
        needs: [unit-testing, code-coverage]    #to ensure that this job runs after the unit testing and code coverage jobs
        runs-on: ubuntu-latest    #to run the job on the latest version of Ubuntu
        steps:
            - name: Checkout code
              uses: actions/checkout@v4    #to check out the code from the repository

            - name: Log in to Docker Hub
              uses: docker/login-action@v2    #to log in to Docker Hub using credentials stored in GitHub secrets
              with:
                  username: ${{ vars.DOCKER_USERNAME }}    #Docker Hub username stored in GitHub secrets
                  password: ${{ secrets.DOCKER_PASSWORD }}    #Docker Hub password stored in GitHub secrets

            - name: Log in to GCHR
              uses: docker/login-action@v2    #to log in to GHCR using credentials stored in GitHub secrets
              with:
                  registry: ghcr.io    #to specify the GitHub Container Registry as the registry to log in to
                  username: ${{ github.repository_owner }}   #to specify the GitHub repository owner as the username for logging in to GitHub Container Registry
                  password: ${{ secrets.GITHUB_TOKEN }}    #to use the GitHub token for authentication when logging in to GitHub Container Registry

            - name: docker build for testing
              uses: docker/build-push-action@v4    #to build the Docker image for testing
              with:
                  context: .    #specify the build context
                  file: ./Dockerfile    #specify the path to the Dockerfile
                  push: false    #to indicate that the image should not be pushed to Docker Hub
                  tags: ${{vars.DOCKER_USERNAME}}/solar-system:${{github.sha}}   #specify the tag for the Docker image
                
            - name: docker image testing
              run: |
                  docker images    #to list the Docker images to verify that the image was built successfully
                  
                  docker run --name solar-system-app -d \
                  -p 3000:3000 \
                  -e MONGO_URI=$MONGO_URI \
                  -e MONGO_USERNAME=$MONGO_USERNAME \
                  -e MONGO_PASSWORD=$MONGO_PASSWORD \
                  ${{vars.DOCKER_USERNAME}}/solar-system:${{github.sha}}    #to run the Docker container with the specified environment variables and port mapping
                  
                  export IP=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)    #to get the IP address of the running container
                  
                  echo "Container IP: $IP"    #to print the IP address of the running container
                  
                  sleep 10    #to wait for the container to start up before running tests
                  
                  echo "Testing image url using wget command"    #to indicate that the workflow is testing the image URL using wget
                  
                  wget -q -O - 127.0.0.1:3000/live | grep live    #to test the live endpoint of the application running in the Docker container
            
            - name: Pushing image to container registries
              uses: docker/build-push-action@v4    #to build the Docker image for testing
              with:
                  context: .    #specify the build context
                  file: ./Dockerfile    #specify the path to the Dockerfile
                  push: true    #to indicate that the image should be pushed to Docker Hub
                  tags: |
                      ghcr.io/${{github.repository_owner}}/solar-system:${{github.sha}}    #specify the tag for the Docker image in GitHub Container Registry
                      ${{vars.DOCKER_USERNAME}}/solar-system:${{github.sha}}   #specify the tag for the Docker image
                